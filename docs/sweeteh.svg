<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2535"/>
      <stop offset="1" stop-color="#15131b"/>
    </linearGradient>
    <linearGradient id="candy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc6e2"/>
      <stop offset="0.55" stop-color="#e7b6ff"/>
      <stop offset="1" stop-color="#a9b8ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#f3b9ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f3b9ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip">
      <rect x="8" y="8" width="112" height="112" rx="32"/>
    </clipPath>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="32" fill="url(#tile)"/>
  <g clip-path="url(#clip)">
    <rect x="8" y="8" width="112" height="80" fill="url(#glow)"/>
    <!-- the island hanging from the top edge -->
    <path d="M 30 8 L 98 8 A 6 6 0 0 0 92 14 L 92 30 A 14 14 0 0 1 78 44 L 50 44 A 14 14 0 0 1 36 30 L 36 14 A 6 6 0 0 0 30 8 Z" fill="url(#candy)"/>
    <rect x="45" y="22" width="22" height="6" rx="3" fill="#2b2535" opacity="0.55"/>
    <circle cx="77" cy="25" r="3.5" fill="#2b2535" opacity="0.55"/>
  </g>
  <!-- a soft smile below it -->
  <path d="M 44 76 Q 64 98 84 76" fill="none" stroke="url(#candy)" stroke-width="9" stroke-linecap="round"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="31.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>

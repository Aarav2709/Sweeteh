; sweeteh island level meter, cava prints one line of bar heights per frame
[general]
bars = 5
framerate = 24
autosens = 1

[input]
method = pipewire

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 60
